<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="system-ui, sans-serif">
  <!-- Background -->
  <rect width="720" height="420" fill="white"/>

  <!-- Title -->
  <text x="392" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">Perpetual Mode: Locked Mass and Conviction Over Time</text>
  <text x="392" y="38" text-anchor="middle" font-size="11" fill="#6B7280">(Full stake locked immediately at t=0)</text>

  <!-- Grid lines (horizontal) -->
  <line x1="65" y1="350" x2="695" y2="350" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="65" y1="272.5" x2="695" y2="272.5" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="65" y1="195" x2="695" y2="195" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="65" y1="117.5" x2="695" y2="117.5" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="65" y1="40" x2="695" y2="40" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Grid lines (vertical: days 0,90,180,270,360,450) -->
  <line x1="65" y1="40" x2="65" y2="350" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="191" y1="40" x2="191" y2="350" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="317" y1="40" x2="317" y2="350" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="443" y1="40" x2="443" y2="350" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="569" y1="40" x2="569" y2="350" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="695" y1="40" x2="695" y2="350" stroke="#E5E7EB" stroke-width="1"/>

  <!-- τ reference line (day 130, x=247) -->
  <line x1="247" y1="40" x2="247" y2="350" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- Locked Mass: flat line at 100% (y=40) -->
  <line x1="65" y1="40" x2="695" y2="40" stroke="#3B82F6" stroke-width="2.5"/>

  <!-- Conviction curve (red), rising toward 100%
       x = 65 + t * (630/450); y = 350 - 3.1 * conviction
       conviction = 100 * (1 - exp(-t/130)) -->
  <polyline
    points="65.0,350.0 82.5,316.2 100.0,286.2 117.5,259.5 135.0,235.8 152.5,214.8 170.0,195.2 187.5,177.9 205.0,162.4 217.0,154.9 247.0,154.0 275.0,138.3 317.0,117.6 359.0,101.7 401.0,88.9 443.0,78.8 483.6,71.0 527.0,64.4 569.0,59.4 611.0,55.4 653.0,52.1 695.0,49.4"
    fill="none" stroke="#EF4444" stroke-width="2.5"/>

  <!-- Annotation dots -->
  <!-- 50% at day 90 (x=191, y=195) -->
  <circle cx="191" cy="195" r="4" fill="#EF4444"/>
  <!-- 63.2% at τ=day 130 (x=247, y=154) -->
  <circle cx="247" cy="154" r="4" fill="#EF4444"/>
  <!-- ~90% at day 299 (x=483.6, y=71) -->
  <circle cx="483.6" cy="71" r="4" fill="#EF4444"/>

  <!-- τ annotation -->
  <text x="250" y="52" font-size="11" fill="#6B7280">τ ≈ 130 days</text>

  <!-- 50% annotation -->
  <rect x="100" y="183" width="78" height="16" rx="3" fill="white" fill-opacity="0.9" stroke="#E5E7EB"/>
  <text x="139" y="195" text-anchor="middle" font-size="10" fill="#EF4444">50% at day 90</text>

  <!-- 63.2% annotation -->
  <rect x="256" y="142" width="106" height="16" rx="3" fill="white" fill-opacity="0.9" stroke="#E5E7EB"/>
  <text x="309" y="154" text-anchor="middle" font-size="10" fill="#EF4444">63.2% (= 1 − 1/e) at τ</text>

  <!-- ~90% annotation -->
  <rect x="398" y="55" width="92" height="16" rx="3" fill="white" fill-opacity="0.9" stroke="#E5E7EB"/>
  <text x="444" y="67" text-anchor="middle" font-size="10" fill="#EF4444">~90% at day 299</text>

  <!-- Axes -->
  <line x1="65" y1="350" x2="695" y2="350" stroke="#374151" stroke-width="1.5"/>
  <line x1="65" y1="40" x2="65" y2="355" stroke="#374151" stroke-width="1.5"/>

  <!-- X-axis tick labels (days) -->
  <text x="65" y="368" text-anchor="middle" font-size="11" fill="#6B7280">0</text>
  <text x="191" y="368" text-anchor="middle" font-size="11" fill="#6B7280">90</text>
  <text x="317" y="368" text-anchor="middle" font-size="11" fill="#6B7280">180</text>
  <text x="443" y="368" text-anchor="middle" font-size="11" fill="#6B7280">270</text>
  <text x="569" y="368" text-anchor="middle" font-size="11" fill="#6B7280">360</text>
  <text x="695" y="368" text-anchor="middle" font-size="11" fill="#6B7280">450</text>

  <!-- X-axis label -->
  <text x="380" y="385" text-anchor="middle" font-size="12" fill="#374151">Days (MaturityRate τ ≈ 130 days; half-life = 90 days)</text>

  <!-- Y-axis tick labels -->
  <text x="58" y="354" text-anchor="end" font-size="11" fill="#6B7280">0%</text>
  <text x="58" y="276.5" text-anchor="end" font-size="11" fill="#6B7280">25%</text>
  <text x="58" y="199" text-anchor="end" font-size="11" fill="#6B7280">50%</text>
  <text x="58" y="121.5" text-anchor="end" font-size="11" fill="#6B7280">75%</text>
  <text x="58" y="44" text-anchor="end" font-size="11" fill="#6B7280">100%</text>

  <!-- Y-axis label -->
  <text transform="rotate(-90)" x="-200" y="14" text-anchor="middle" font-size="12" fill="#374151">% of Original Locked Mass</text>

  <!-- Legend -->
  <line x1="430" y1="405" x2="456" y2="405" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="460" y="409" font-size="11" fill="#374151">Locked mass (constant)</text>
  <line x1="596" y1="405" x2="622" y2="405" stroke="#EF4444" stroke-width="2.5"/>
  <text x="626" y="409" font-size="11" fill="#374151">Conviction</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="system-ui, sans-serif">
  <!-- Background -->
  <rect width="720" height="420" fill="white"/>

  <!-- Title -->
  <text x="392" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">Perpetual Mode: Locked Mass and Conviction Over Time</text>
  <text x="392" y="38" text-anchor="middle" font-size="11" fill="#6B7280">(Full stake locked immediately at t=0)</text>

  <!-- Grid lines (horizontal) -->
  <line x1="65" y1="350" x2="695" y2="350" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="65" y1="272.5" x2="695" y2="272.5" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="65" y1="195" x2="695" y2="195" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="65" y1="117.5" x2="695" y2="117.5" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="65" y1="50" x2="695" y2="50" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Grid lines (vertical: days 0,30,60,90,120,150) -->
  <line x1="65" y1="50" x2="65" y2="350" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="191" y1="50" x2="191" y2="350" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="317" y1="50" x2="317" y2="350" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="443" y1="50" x2="443" y2="350" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="569" y1="50" x2="569" y2="350" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="695" y1="50" x2="695" y2="350" stroke="#E5E7EB" stroke-width="1"/>

  <!-- τ reference line (day 43.3, x=245.6) -->
  <line x1="245.6" y1="50" x2="245.6" y2="350" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="5,3"/>
  <!-- 30-day reference line (x=191.0) already a grid line -->

  <!-- Locked Mass: flat line at 100% (y=50) -->
  <line x1="65" y1="50" x2="695" y2="50" stroke="#3B82F6" stroke-width="2.5"/>

  <!-- Conviction curve (red), rising toward 100% -->
  <polyline
    points="65.0,350.0 86.0,316.2 107.0,286.1 128.0,259.2 149.0,235.4 170.0,214.0 191.0,195.0 212.0,178.2 233.0,163.1 245.6,154.9 275.0,137.7 317.0,117.5 380.0,94.9 443.0,78.8 485.0,70.7 569.0,59.4 632.0,53.7 695.0,49.7"
    fill="none" stroke="#EF4444" stroke-width="2.5"/>

  <!-- Annotation dots -->
  <!-- 50% at day 30 (x=191, y=195) -->
  <circle cx="191" cy="195" r="4" fill="#EF4444"/>
  <!-- 63.2% at τ (x=245.6, y=154.9) -->
  <circle cx="245.6" cy="154.9" r="4" fill="#EF4444"/>
  <!-- ~90% at day 110 (x=485, y=70.7) -->
  <circle cx="485" cy="70.7" r="4" fill="#EF4444"/>

  <!-- τ annotation -->
  <text x="248" y="62" font-size="11" fill="#6B7280">τ = 43 days</text>

  <!-- 50% annotation -->
  <rect x="100" y="183" width="78" height="16" rx="3" fill="white" fill-opacity="0.9" stroke="#E5E7EB"/>
  <text x="139" y="195" text-anchor="middle" font-size="10" fill="#EF4444">50% at day 30</text>

  <!-- 63.2% annotation (half-life) -->
  <rect x="256" y="142" width="106" height="16" rx="3" fill="white" fill-opacity="0.9" stroke="#E5E7EB"/>
  <text x="309" y="154" text-anchor="middle" font-size="10" fill="#EF4444">63.2% (= 1 − 1/e) at τ</text>

  <!-- ~90% annotation -->
  <rect x="422" y="58" width="80" height="16" rx="3" fill="white" fill-opacity="0.9" stroke="#E5E7EB"/>
  <text x="462" y="70" text-anchor="middle" font-size="10" fill="#EF4444">~90% at day 110</text>

  <!-- Axes -->
  <line x1="65" y1="350" x2="695" y2="350" stroke="#374151" stroke-width="1.5"/>
  <line x1="65" y1="50" x2="65" y2="355" stroke="#374151" stroke-width="1.5"/>

  <!-- X-axis tick labels (days) -->
  <text x="65" y="368" text-anchor="middle" font-size="11" fill="#6B7280">0</text>
  <text x="191" y="368" text-anchor="middle" font-size="11" fill="#6B7280">30</text>
  <text x="317" y="368" text-anchor="middle" font-size="11" fill="#6B7280">60</text>
  <text x="443" y="368" text-anchor="middle" font-size="11" fill="#6B7280">90</text>
  <text x="569" y="368" text-anchor="middle" font-size="11" fill="#6B7280">120</text>
  <text x="695" y="368" text-anchor="middle" font-size="11" fill="#6B7280">150</text>

  <!-- X-axis label -->
  <text x="380" y="385" text-anchor="middle" font-size="12" fill="#374151">Days (MaturityRate = 311,622 blocks ≈ 43.3 days)</text>

  <!-- Y-axis tick labels -->
  <text x="58" y="354" text-anchor="end" font-size="11" fill="#6B7280">0%</text>
  <text x="58" y="276.5" text-anchor="end" font-size="11" fill="#6B7280">25%</text>
  <text x="58" y="199" text-anchor="end" font-size="11" fill="#6B7280">50%</text>
  <text x="58" y="121.5" text-anchor="end" font-size="11" fill="#6B7280">75%</text>
  <text x="58" y="54" text-anchor="end" font-size="11" fill="#6B7280">100%</text>

  <!-- Y-axis label -->
  <text transform="rotate(-90)" x="-200" y="14" text-anchor="middle" font-size="12" fill="#374151">% of Original Locked Mass</text>

  <!-- Legend -->
  <line x1="430" y1="405" x2="456" y2="405" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="460" y="409" font-size="11" fill="#374151">Locked mass (constant)</text>
  <line x1="596" y1="405" x2="622" y2="405" stroke="#EF4444" stroke-width="2.5"/>
  <text x="626" y="409" font-size="11" fill="#374151">Conviction</text>
</svg>

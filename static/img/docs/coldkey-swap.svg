#000000" font-family="Monospace" font-size="13" lengthAdjust="spacing" textLength="237.6118" x="11" y="240.356">`announce_coldkey_swap`&#160;extrinsic.</text><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg1"><polygon fill="#444444" points="618.3779,270.5547,628.3779,274.5547,618.3779,278.5547,622.3779,274.5547" style="stroke:#444444;stroke-width:1;"/><line style="stroke:#444444;stroke-width:1;" x1="173.1694" x2="624.3779" y1="274.5547" y2="274.5547"/><text fill="#000000" font-family="Monospace" font-size="13" lengthAdjust="spacing" textLength="433.2085" x="180.1694" y="269.4888">announce_coldkey_swap(source_private_key,&#160;destination&#160;address)</text></g><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1;" width="1084.1821" x="0" y="303.1211"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="1084.1821" y1="303.1211" y2="303.1211"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="1084.1821" y1="306.1211" y2="306.1211"/><rect fill="#EEEEEE" height="23.1328" style="stroke:#000000;stroke-width:2;" width="445.7739" x="319.2041" y="292.5547"/><text fill="#000000" font-family="Monospace" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="427.248" x="325.2041" y="308.6216">Pending&#160;Swap&#160;/&#160;LOCKED&#160;window&#160;(~5&#160;days&#160;/&#160;36,000&#160;blocks)</text><path d="M312,330.6875 L312,385.6875 L948,385.6875 L948,340.6875 L938,330.6875 L312,330.6875" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M938,330.6875 L938,340.6875 L948,340.6875 L938,330.6875" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Monospace" font-size="13" lengthAdjust="spacing" textLength="596.7813" x="318" y="347.7544">This&#160;waiting&#160;period&#160;is&#160;required&#160;in&#160;case&#160;an&#160;attacker&#160;steals&#160;a&#160;key&#160;and&#160;tries&#160;to&#160;execute&#160;a&#160;swap.</text><text fill="#000000" font-family="Monospace" font-size="13" lengthAdjust="spacing" textLength="615.0688" x="318" y="362.8872">The&#160;owner&#160;of&#160;the&#160;coldkey&#160;can&#160;*dispute*&#160;the&#160;swap,&#160;blocking&#160;it&#160;until&#160;the&#160;triumvirate&#160;adjudicates.</text><text fill="#000000" font-family="Monospace" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="318" y="378.02">&#160;</text><path d="M566.2974,398.0859 L721.1563,398.0859 L721.1563,405.2188 L711.1563,415.2188 L566.2974,415.2188 L566.2974,398.0859" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="127.6641" style="stroke:#000000;stroke-width:1.5;" width="507.8848" x="566.2974" y="398.0859"/><text fill="#000000" font-family="Monospace" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="109.8589" x="581.2974" y="411.1528">Disputed&#160;Swap</text><path d="M576.2974,422.2188 L645.7485,422.2188 L645.7485,429.3516 L635.7485,439.3516 L576.2974,439.3516 L576.2974,422.2188" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="96.5313" style="stroke:#000000;stroke-width:1.5;" width="487.8848" x="576.2974" y="422.2188"/><text fill="#000000" font-family="Monospace" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="24.4512" x="591.2974" y="435.2856">opt</text><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg2"><polygon fill="#FF0000" points="641.3779,456.4844,631.3779,460.4844,641.3779,464.4844,637.3779,460.4844" style="stroke:#FF0000;stroke-width:1;"/><line style="stroke:#FF0000;stroke-width:1;" x1="635.3779" x2="934.1919" y1="460.4844" y2="460.4844"/><text fill="#000000" font-family="Monospace" font-size="13" lengthAdjust="spacing" textLength="280.814" x="647.3779" y="455.4185">dispute_coldkey_swap(source_private_key)</text></g><path d="M635,473.4844 L635,513.4844 L1054,513.4844 L1054,483.4844 L1044,473.4844 L635,473.4844" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1044,473.4844 L1044,483.4844 L1054,483.4844 L1044,473.4844" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Monospace" font-size="13" lengthAdjust="spacing" textLength="108.6274" x="641" y="490.5513">Swap&#160;is&#160;blocked.</text><text fill="#000000" font-family="Monospace" font-size="13" lengthAdjust="spacing" textLength="398.1821" x="641" y="505.6841">The&#160;wallet&#160;remains&#160;locked&#160;pending&#160;action&#160;by&#160;the&#160;triumvirate.</text><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1;" width="1084.1821" x="0" y="553.3164"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="1084.1821" y1="553.3164" y2="553.3164"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="1084.1821" y1="556.3164" y2="556.3164"/><rect fill="#EEEEEE" height="23.1328" style="stroke:#000000;stroke-width:2;" width="151.2236" x="466.4792" y="542.75"/><text fill="#000000" font-family="Monospace" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="137.2236" x="472.4792" y="558.8169">Finalization&#160;period</text><path d="M323,580.8828 L323,620.8828 L936,620.8828 L936,590.8828 L926,580.8828 L323,580.8828" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M926,580.8828 L926,590.8828 L936,590.8828 L926,580.8828" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Monospace" font-size="13" lengthAdjust="spacing" textLength="206.3433" x="329" y="597.9497">Disputes&#160;are&#160;no&#160;longer&#160;allowed.</text><text fill="#000000" font-family="Monospace" font-size="13" lengthAdjust="spacing" textLength="592.7124" x="329" y="613.0825">Keyholder&#160;can&#160;*finalize*&#160;swap&#160;using&#160;the&#160;(secret)&#160;coldkey&#160;used&#160;to&#160;make&#160;the&#160;announcement.</text><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg3"><polygon fill="#444444" points="618.3779,643.2813,628.3779,647.2813,618.3779,651.2813,622.
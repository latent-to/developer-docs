00000" font-family="Monospace" font-size="14" lengthAdjust="spacing" textLength="110.4072" x="876.9883" y="811.8076">Swap Disputant</text><text fill="#000000" font-family="Monospace" font-size="14" lengthAdjust="spacing" textLength="110.3389" x="877.0225" y="828.1045">(must hold key)</text><ellipse cx="935.1919" cy="839.9063" fill="#E2E2F0" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M935.1919,847.9063 L935.1919,874.9063 M922.1919,855.9063 L948.1919,855.9063 M935.1919,874.9063 L922.1919,889.9063 M935.1919,874.9063 L948.1919,889.9063" fill="none" style="stroke:#181818;stroke-width:0.5;"/></g><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1;" width="1084.1821" x="0" y="165.457"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="1084.1821" y1="165.457" y2="165.457"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="1084.1821" y1="168.457" y2="168.457"/><rect fill="#EEEEEE" height="23.1328" style="stroke:#000000;stroke-width:2;" width="128.8926" x="477.6448" y="154.8906"/><text fill="#000000" font-family="Monospace" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="110.3667" x="483.6448" y="170.9575">Announcement</text><path d="M5,193.0234 L5,248.0234 L341,248.0234 L341,203.0234 L331,193.0234 L5,193.0234" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M331,193.0234 L331,203.0234 L341,203.0234 L331,193.0234" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Monospace" font-size="13" lengthAdjust="spacing" textLength="315.8594" x="11" y="210.0903">The iniator (key owner wanting to swap the key)</text><text fill="#000000" font-family="Monospace" font-size="13" lengthAdjust="spacing" textLength="295.5024" x="11" y="225.2231">triggers the swap, using a client to submit an</text><text fill="#000000" font-family="Monospace" font-size="13" lengthAdjust="spacing" textLength="237.6118" x="11" y="240.356">`announce_coldkey_swap` extrinsic.</text><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg1"><polygon fill="#444444" points="618.3779,270.5547,628.3779,274.5547,618.3779,278.5547,622.3779,274.5547" style="stroke:#444444;stroke-width:1;"/><line style="stroke:#444444;stroke-width:1;" x1="173.1694" x2="624.3779" y1="274.5547" y2="274.5547"/><text fill="#000000" font-family="Monospace" font-size="13" lengthAdjust="spacing" textLength="433.2085" x="180.1694" y="269.4888">announce_coldkey_swap(source_private_key, destination address)</text></g><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1;" width="1084.1821" x="0" y="303.1211"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="1084.1821" y1="303.1211" y2="303.1211"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="1084.1821" y1="306.1211" y2="306.1211"/><rect fill="#EEEEEE" height="23.1328" style="stroke:#000000;stroke-width:2;" width="445.7739" x="319.2041" y="292.5547"/><text fill="#000000" font-family="Monospace" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="427.248" x="325.2041" y="308.6216">Pending Swap / LOCKED window (~5 days / 36,000 blocks)</text><path d="M275,332.6875 L485.2231,332.6875 L485.2231,339.8203 L475.2231,349.8203 L275,349.8203 L275,332.6875" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="193.0625" style="stroke:#000000;stroke-width:1.5;" width="799.1821" x="275" y="332.6875"/><text fill="#000000" font-family="Monospace" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="165.2231" x="290" y="345.7544">Pending Swap/Dispute</text><path d="M285,354.8203 L285,409.8203 L974,409.8203 L974,364.8203 L964,354.8203 L285,354.8203" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M964,354.8203 L964,364.8203 L974,364.8203 L964,354.8203" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Monospace" font-size="13" lengthAdjust="spacing" textLength="618.0459" x="291" y="371.8872">This waiting period is required in case an attacker steals your key and tries to execute a swap.</text><text fill="#000000" font-family="Monospace" font-size="13" lengthAdjust="spacing" textLength="668.5415" x="291" y="387.02">Source coldkey is in "pending swap" state. A holder of the coldkey can *dispute* the swap, blocking it.</text><text fill="#000000" font-family="Monospace" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="291" y="402.1528"> </text><path d="M576.2974,422.2188 L645.7485,422.2188 L645.7485,429.3516 L635.7485,439.3516 L576.2974,439.3516 L576.2974,422.2188" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="96.5313" style="stroke:#000000;stroke-width:1.5;" width="487.8848" x="576.2974" y="422.2188"/><text fill="#000000" font-family="Monospace" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="24.4512" x="591.2974" y="435.2856">opt</text><text fill="#000000" font-family="Monospace" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="156.707" x="660.7485" y="434.4292">[Dispute during pending]</text><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg2"><polygon fill="#FF0000" points="641.3779,456.4844,631.3779,460.4844,641.3779,464.4844,637.3779,460.4844" style="stroke:#FF0000;stroke-width:1;"/><line style="stroke:#FF0000;stroke-width:1;" x1="635.3779" x2="934.1919" y1="460.4844" y2="460.4844"/><text fill="#000000" font-family="Monospace" font-size="13" lengthAdjust="spacing" textLength="280.814" x="647.3779" y="455.4185">dispute_coldkey_swap(source_private_key)</text></g><path d="M635,473.4844 L635,513.4844 L1054,513.4844 L1054,483.4844 L1044,473.4844 L635,473.4844" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1044,473.4844 L1044,483.4844 L1054,483.4844 L1044,473.4844" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Monospace" font-size="13" lengthAdjust="spacing" textLength="108.6274" x="641" y="490.5513">Swap is blocked.</text><text fill="#000000" font-family="Monospace" font-size="13" lengthAdjust="spacing" textLength="398.1821" x="641" y="505.6841">The wallet remains locked pending action by the triumvirate.</text><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1;" width="1084.1821" x="0" y="553.3164"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="1084.1821" y1="553.3164" y2="553.3164"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="1084.1821" y1="556.3164" y2="556.3164"/><rect fill="#EEEEEE" height="23.1328" style="stroke:#000000;stroke-width:2;" width="151.2236" x="466.4792" y="542.75"/><text fill="#000000" font-family="Monospace" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="137.2236" x="472.4792" y="558.8169">Finalization period</text><path d="M323,580.8828 L323,620.8828 L936,620.8828 L936,590.8828 L926,580.8828 L323,580.8828" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M926,580.8828 L926,590.8828 L936,590.8828 L926,580.8828" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Monospace" font-size="13" lengthAdjust="spacing" textLength="206.3433" x="329" y="597.9497">Disputes are no longer allowed.</text><text fill="#000000" font-family="Monospace" font-size="13" lengthAdjust="spacing" textLength="592.7124" x="329" y="613.0825">Keyholder can *finalize* swap using the (secret) coldkey used to make the announcement.</text><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg3"><polygon fill="#444444" points="618.3779,643.2813,628.3779,647.2813,618.3779,651.2813,622.3779,647.2813" style="stroke:#444444;stroke-width:1;"/><line style="stroke:#444444;stroke-width:1;" x1="173.1694" x2="624.3779" y1="647.2813" y2="647.2813"/><text fill="#000000" font-family="Monospace" font-size="13" lengthAdjust="spacing" textLength="377.8315" x="180.1694" y="642.2153">execute_coldkey_swap(source_private_key, dest_coldkey)</t